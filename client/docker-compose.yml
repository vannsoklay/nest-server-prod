services:
  merchant:
    build:
      context: ./.
      dockerfile: apps/merchant/Dockerfile
    container_name: commerce_merchant
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      INTERNAL_API_URL: http://app:3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL:-http://localhost/merchant}
      NEXT_PUBLIC_WEBSOCKET_URL: ${NEXT_PUBLIC_WEBSOCKET_URL:-http://localhost:3000}
    expose:
      - "3000"
    networks:
      - commerce_network

  # pos:
  #   build:
  #     context: ./
  #     dockerfile: apps/pos/Dockerfile
  #   container_name: commerce_pos
  #   restart: unless-stopped
  #   environment:
  #     NODE_ENV: production
  #     PORT: 3001
  #     HOSTNAME: 0.0.0.0
  #     INTERNAL_API_URL: http://app:3000
  #   expose:
  #     - "3001"
  #   networks:
  #     - commerce_network

  storefront:
    build:
      context: ./.
      dockerfile: apps/storefront/Dockerfile
    container_name: commerce_storefront
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      HOSTNAME: 0.0.0.0
      INTERNAL_API_URL: http://app:3000
    expose:
      - "3002"
    networks:
      - commerce_network

  nginx:
    image: nginx:1.27-alpine
    container_name: commerce_nginx
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    # volumes:
    #   - /home/lay512/projects/nest-server-prod/client/deploy/nginx:/etc/nginx:ro
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - merchant
      # - pos
      - storefront
    networks:
      - commerce_network

networks:
  commerce_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: